<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>César Patiño — Inicia tu negocio YA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Colores de marca (cámbialos aquí) ===== */
  :root{
    --bg:#18101f;
    --card:#231a2c;
    --text:#fff8ef;
    --muted:#c9bfd1;
    --accent:#ff6a35;
    --line:rgba(255,248,239,.12);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--bg)}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    background:radial-gradient(70% 45% at 50% 0%,rgba(255,106,53,.22),transparent 70%),var(--bg);
    min-height:100vh;
  }
  main{max-width:440px;margin:0 auto;padding:56px 22px 40px;text-align:center}

  /* Animación suave de entrada, escalonada */
  .rise{opacity:0;transform:translateY(18px);animation:rise .7s ease forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
  .d4{animation-delay:.35s}.d5{animation-delay:.45s}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}}

  /* Foto de perfil — para usar tu foto, cambia el contenido de #avatar por <img src="..."> */
  #avatar{
    width:116px;height:116px;border-radius:50%;margin:0 auto 18px;
    border:3px solid var(--accent);
    overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:var(--card);
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:38px;color:var(--accent);
    box-shadow:0 12px 34px -10px rgba(255,106,53,.5);
  }
  #avatar img{width:100%;height:100%;object-fit:cover}

  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;letter-spacing:-.01em}
  .bio{margin-top:10px;color:var(--muted);font-size:15px;line-height:1.55}
  .bio b{color:var(--text)}

  /* Redes: se llenan desde la lista SOCIALS del script */
  .socials{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap}
  .socials a{
    color:var(--text);text-decoration:none;font-size:13px;font-weight:600;
    border:1px solid var(--line);padding:8px 16px;border-radius:999px;
    transition:border-color .15s,color .15s;
  }
  .socials a:hover{border-color:var(--accent);color:var(--accent)}

  /* Botones — enlaces directos, sin pantallas intermedias */
  .links{display:flex;flex-direction:column;gap:14px;margin-top:30px}
  .btn{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 20px;border-radius:14px;text-decoration:none;text-align:left;
    background:var(--card);border:1px solid var(--line);color:var(--text);
    transition:transform .18s ease,border-color .18s ease;
  }
  .btn:hover{transform:translateY(-3px);border-color:var(--accent)}
  .btn strong{display:block;font-size:15.5px}
  .btn span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1004}
  .btn.primary span{color:rgba(26,16,4,.75)}
  .btn svg{width:22px;height:22px;flex:none}

  footer{margin-top:40px;font-size:12px;color:var(--muted)}
</style>
</head>

    box.appendChild(a);
  });
</script>
